MEMORY {                                                                    # MEMORY lists the places where bytes can go: RAM, the file header and each 16 KB bank.
  ZP:    start = $0000, size = $0100, type = rw, file = "";                 # Zero page: the first 256 bytes of RAM. file = "": this area is not in the ROM file.
  OAM:   start = $0200, size = $0100, type = rw, file = "";                 # 256 bytes of RAM for the sprite list. The NMI copies this page to the PPU every frame.
  RAM:   start = $0300, size = $0500, type = rw, file = "";                 # The rest of the 2 KB of RAM: $0300–$07FF. The stack uses $0100–$01FF, so that page is not listed.
  HDR:   start = $0000, size = $0010, fill = yes;                           # The 16-byte header at the start of the file. fill = yes pads the area to its full size.
  PRG0:  start = $8000, size = $4000, fill = yes, fillval = $FF, bank = 0;  # Bank 0: 16 KB. It appears at $8000 when you select it. bank = 0 lets the code ask for this number.
  PRG1:  start = $8000, size = $4000, fill = yes, fillval = $FF, bank = 1;  # Bank 1. Every switchable bank starts at $8000, because that is where it appears.
  PRG2:  start = $8000, size = $4000, fill = yes, fillval = $FF, bank = 2;  # Bank 2.
  PRG3:  start = $8000, size = $4000, fill = yes, fillval = $FF, bank = 3;  # Bank 3.
  EMPTY: start = $8000, size = $6C000, fill = yes, fillval = $FF;           # Banks 4–30 as one block of $FF bytes: 27 × 16 KB = $6C000. To use bank 4, add a PRG4 line and take $4000 off this size.
  PRG31: start = $C000, size = $4000, fill = yes, fillval = $FF, bank = 31; # Bank 31, the fixed bank. It is always at $C000–$FFFF, so all code goes here.
}

SEGMENTS {                                            # SEGMENTS tells the linker which memory area holds each segment of the source.
  ZEROPAGE: load = ZP,    type = zp;                  # Variables from .segment "ZEROPAGE". type = zp lets ca65 use the short, fast instructions for them.
  OAM:      load = OAM,   type = bss;                 # The sprite list. bss: reserved RAM. Nothing goes in the file.
  BSS:      load = RAM,   type = bss;                 # The other RAM variables.
  HEADER:   load = HDR,   type = ro;                  # The header bytes. ro: read-only.
  BANK0:    load = PRG0,  type = ro, optional = yes;  # Data for bank 0. optional = yes: no warning if the source has no BANK0 yet.
  BANK1:    load = PRG1,  type = ro, optional = yes;  # Data for bank 1.
  BANK2:    load = PRG2,  type = ro, optional = yes;  # Data for bank 2.
  BANK3:    load = PRG3,  type = ro, optional = yes;  # Data for bank 3.
  CODE:     load = PRG31, type = ro;                  # The program code, from the start of the fixed bank ($C000).
  RODATA:   load = PRG31, type = ro;                  # Read-only data in the fixed bank, after the code: palettes and tables.
  VECTORS:  load = PRG31, type = ro, start = $FFFA;   # The 3 interrupt addresses. The CPU reads them from $FFFA–$FFFF.
}
